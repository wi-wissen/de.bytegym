name: Release

# Two ways to cut a release:
#
#   1. Actions -> Release -> "Run workflow", enter the version (e.g. 0.2.0).
#      The tag v0.2.0 is created by the release step itself, on the commit the
#      workflow ran on — nobody has to push a tag.
#   2. Push a tag: git tag v0.2.0 && git push origin v0.2.0
#
# Either way the version must match src-tauri/tauri.conf.json, which is what the
# APK reports about itself; bump that first.
#
# The APK is arm64-v8a only. Every Android phone from roughly 2015 onwards is
# arm64; x86/x86_64 are emulator targets and armeabi-v7a is long-obsolete
# hardware. Carrying all four quadrupled the download for no one's benefit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0). Must match src-tauri/tauri.conf.json.'
        required: true

permissions:
  contents: write # needed to create the release and upload the APK

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and check the version
        id: version
        # Tag v1.2.3 -> 1.2.3; a manual run takes the input. The input goes through
        # env, never ${{ }} inside the script, so its text can't run as shell code.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="$INPUT_VERSION"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3"
            exit 1
          fi
          # The APK takes its versionName/versionCode from tauri.conf.json, not from
          # the tag. A mismatch would publish a "0.3.0" file that calls itself 0.2.0
          # and won't install over the real 0.2.0.
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$VERSION" != "$CONF" ]; then
            echo "::error::Release $VERSION does not match src-tauri/tauri.conf.json version $CONF. Bump it first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BYTEGYM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::BYTEGYM_KEYSTORE_BASE64 is not set — the APK would be unsigned and could not be installed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bytegym-release.p12"

      - name: Build signed APK (arm64)
        env:
          # build.gradle.kts reads these; environment always wins over .env
          BYTEGYM_KEYSTORE_PATH: ${{ runner.temp }}/bytegym-release.p12
          BYTEGYM_KEYSTORE_PASSWORD: ${{ secrets.BYTEGYM_KEYSTORE_PASSWORD }}
          BYTEGYM_KEY_ALIAS: ${{ secrets.BYTEGYM_KEY_ALIAS }}
          BYTEGYM_KEY_PASSWORD: ${{ secrets.BYTEGYM_KEY_PASSWORD }}
        run: npx tauri android build --apk --target aarch64

      - name: Name the APK after its version
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          OUT="bytegym-${VERSION}-android-arm64.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish an unsigned APK
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this exact commit when it doesn't exist yet (manual run).
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ByteGym ${{ steps.version.outputs.version }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
