<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <!-- No pinch-zoom: a native app scales with the system font size (which the
         WebView honours), not by zooming the whole UI. `viewport-fit=cover` lets the
         page draw behind the system bars; the safe-area insets keep content clear. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ByteGym</title>
    <!-- Fonts are bundled (src/main.js), not fetched from Google: the app has to
         render its icons offline, and shouldn't tell a third party it was opened. -->
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
